<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>台股觀測站｜上市櫃行情與籌碼</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#17202c;--muted:#758092;--line:#e7eaf0;--blue:#315bd6;--blue2:#edf2ff;--red:#d84a4a;--green:#15966a;--shadow:0 5px 22px #17202c0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif}header{height:auto;min-height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:14px max(22px,calc((100% - 1440px)/2));position:sticky;top:0;z-index:4}.brand{font-size:19px;font-weight:800;white-space:nowrap}.brand i{font-style:normal;color:var(--blue)}nav{display:flex;gap:5px;flex-wrap:wrap}nav button,.tool{border:0;background:transparent;padding:9px 13px;border-radius:9px;color:var(--muted);font:inherit;cursor:pointer}nav button.active{background:var(--blue2);color:var(--blue);font-weight:700}#updated{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}main{max-width:1440px;margin:auto;padding:26px 24px 60px}.eyebrow{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.08em}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 20px}.heading h1{font-size:25px;margin:3px 0}.sub{color:var(--muted);font-size:13px}.notice{border:1px solid #f0dfb7;background:#fffaf0;color:#795b21;padding:11px 14px;border-radius:10px;margin-bottom:18px;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.metric,.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.metric{padding:16px 18px}.metric label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:23px;margin-top:5px}.metric small{color:var(--muted)}.panel{padding:18px;margin-bottom:17px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panelhead h2{font-size:16px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 11px;font:inherit}.filters input{min-width:220px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:11px 12px;border-bottom:1px solid #eff1f5}th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}th:first-child,td:first-child{text-align:left}.stock{font-weight:700}.code{color:var(--muted);font-size:12px;margin-left:7px}.up{color:var(--red)}.down{color:var(--green)}.muted{color:var(--muted)}.empty{text-align:center!important;padding:35px;color:var(--muted)}.tag{font-size:11px;background:#f1f3f7;color:#657084;padding:3px 8px;border-radius:99px}.star{border:0;background:none;color:#aab2bf;font-size:18px;cursor:pointer}.star.on{color:#e7a323}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stockcard{padding:17px;border:1px solid var(--line);border-radius:12px;background:#fff}.stockcard h3{margin:0 0 4px}.stockcard p{margin:5px 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;align-items:center}.primary{background:var(--blue);color:white;border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font:inherit}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}.detail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.detail div{background:#f8f9fc;padding:12px;border-radius:9px}.detail small{display:block;color:var(--muted)}.detail b{font-size:17px}.footer{color:var(--muted);font-size:12px;line-height:1.8;padding:10px 2px}.loading{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}header{gap:12px;flex-wrap:wrap}#updated{width:100%;margin:0}}@media(max-width:580px){main{padding:18px 12px 40px}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:19px}.grid{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.detail{grid-template-columns:repeat(2,1fr)}header{padding:12px}.brand{width:100%}}
</style></head><body>
<header><div class="brand">◈ <i>台股</i>觀測站</div><nav><button class="active" data-view="market">市場總覽</button><button data-view="stocks">個股查詢</button><button data-view="chips">法人籌碼</button><button data-view="watch">我的自選</button><button data-view="supply">供應鏈</button></nav><div id="updated">資料載入中…</div></header>
<main><div class="heading"><div><div class="eyebrow">TAIWAN EQUITY INTELLIGENCE</div><h1 id="pageTitle">市場總覽</h1><div class="sub" id="pageSub">整合上市與上櫃官方每日行情資料</div></div><div class="actions"><button class="secondary" id="refresh">重新載入</button></div></div>
<div class="notice" id="notice">資料載入中。此網站不會以隨機數字填補缺漏資料。</div><section id="content"><div class="loading">正在讀取官方市場資料…</div></section>
<div class="footer">資料來源：臺灣證券交易所（TWSE）、證券櫃檯買賣中心（TPEx）公開資料。行情以各來源最新公布的每日收盤資料為準，非逐筆即時報價。法人資料為已公布交易日統計。資料可能因官方端點更新、維護或欄位異動而延遲或暫時無法取得。本網站資訊僅供研究參考，不構成投資建議。</div></main>
<script>
const state={quotes:[],t86:{},view:'market',query:'',market:'全部市場',sort:'amount',watch:JSON.parse(localStorage.getItem('tw-watch')||'[]'),selected:null};
const $=id=>document.getElementById(id),fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d}),cls=v=>v>0?'up':v<0?'down':'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){ $('notice').textContent='正在向官方資料來源更新行情與法人資訊…';try{const [q,f]=await Promise.all([fetch('/api/quotes').then(r=>{if(!r.ok)throw Error('行情 API 暫時無法取得');return r.json()}),fetch('/api/t86').then(r=>r.ok?r.json():{rows:{},error:'法人資料暫時無法取得'})]);state.quotes=q.items||[];state.t86=f.rows||{};state.quoteInfo=q;state.t86Date=f.date||'';$('updated').textContent='更新時間 '+(q.updated_at||'—');$('notice').textContent=(q.disclaimer||'')+(q.errors?.length?'；部分來源異常：'+q.errors.join('／'):'')+(f.error?'；法人資料：'+f.error:'');render()}catch(e){$('notice').textContent='資料讀取失敗：'+e.message+'。請稍後重試；不顯示虛構行情。';$('content').innerHTML='<div class="panel empty">目前無法連線取得官方資料。請確認伺服器已啟動，或稍後重新載入。</div>'}}
function filtered(){let a=state.quotes.filter(x=>(state.market==='全部市場'||x.market===state.market)&&(!state.query||(x.code+x.name).toLowerCase().includes(state.query.toLowerCase())));a.sort((x,y)=>{let k=state.sort;if(k==='change')return (y.change??-Infinity)-(x.change??-Infinity);if(k==='volume')return (y.volume||0)-(x.volume||0);if(k==='name')return x.code.localeCompare(y.code);return (y.amount||0)-(x.amount||0)});return a}
function table(rows,showChips=false){if(!rows.length)return '<div class="empty">沒有符合條件的資料</div>';return `<div class="tablewrap"><table><thead><tr><th>股票</th><th>市場</th><th>收盤價</th><th>漲跌</th><th>成交量（股）</th><th>成交金額（元）</th>${showChips?'<th>外資買賣超（張）</th>':''}<th>自選</th></tr></thead><tbody>${rows.map(x=>{let c=state.t86[x.code];return `<tr><td><span class="stock">${esc(x.name||'未提供名稱')}</span><span class="code">${esc(x.code)}</span></td><td><span class="tag">${esc(x.market)}</span></td><td>${fmt(x.price)}</td><td class="${cls(x.change)}">${x.change==null?'—':(x.change>0?'+':'')+fmt(x.change)}</td><td>${fmt(x.volume,0)}</td><td>${fmt(x.amount,0)}</td>${showChips?`<td class="${cls(c?.foreign_net_lots)}">${c?fmt(c.foreign_net_lots,0):'—'}</td>`:''}<td><button class="star ${state.watch.includes(x.code)?'on':''}" onclick="toggleWatch('${esc(x.code)}')">${state.watch.includes(x.code)?'★':'☆'}</button></td></tr>`}).join('')}</tbody></table></div>`}
function metrics(){let all=state.quotes,up=all.filter(x=>(x.change||0)>0).length,down=all.filter(x=>(x.change||0)<0).length,amt=all.reduce((s,x)=>s+(x.amount||0),0);return `<div class="metrics"><div class="metric"><label>上市櫃資料筆數</label><strong>${fmt(all.length,0)}</strong><small>官方最新日行情</small></div><div class="metric"><label>上漲檔數</label><strong class="up">${fmt(up,0)}</strong><small>依官方漲跌價差欄位</small></div><div class="metric"><label>下跌檔數</label><strong class="down">${fmt(down,0)}</strong><small>依官方漲跌價差欄位</small></div><div class="metric"><label>成交金額合計</label><strong>${amt?fmt(amt/1e8,1)+' 億':'—'}</strong><small>已取得資料加總</small></div></div>`}
function render(){let c=$('content');if(state.view==='market'){ $('pageTitle').textContent='市場總覽';$('pageSub').textContent='上市與上櫃每日收盤行情｜非逐筆即時報價';c.innerHTML=metrics()+`<section class="panel"><div class="panelhead"><h2>全市場行情</h2><div class="filters"><input id="search" placeholder="輸入股票代號或名稱" value="${esc(state.query)}"><select id="market"><option>全部市場</option><option ${state.market==='上市'?'selected':''}>上市</option><option ${state.market==='上櫃'?'selected':''}>上櫃</option></select><select id="sort"><option value="amount">成交金額排序</option><option value="change" ${state.sort==='change'?'selected':''}>漲跌排序</option><option value="volume" ${state.sort==='volume'?'selected':''}>成交量排序</option><option value="name" ${state.sort==='name'?'selected':''}>代號排序</option></select></div></div><div id="quotesTable">${table(filtered())}</div></section>`;wireFilters()}
else if(state.view==='stocks'){ $('pageTitle').textContent='個股查詢';$('pageSub').textContent='以官方股票代號及名稱查詢目前可取得的日行情';c.innerHTML=`<section class="panel"><div class="panelhead"><h2>搜尋個股</h2></div><div class="filters"><input id="search" placeholder="例如 2330、台積電" value="${esc(state.query)}"></div><div id="quotesTable">${table(filtered())}</div></section>`;wireFilters()}
else if(state.view==='chips'){ $('pageTitle').textContent='法人籌碼';$('pageSub').textContent=`外資買賣超統計｜資料日期 ${state.t86Date||'—'}｜單位：張`;let rows=state.quotes.filter(x=>state.t86[x.code]).map(x=>({...x,net:state.t86[x.code].foreign_net_lots})).sort((a,b)=>b.net-a.net);c.innerHTML=`<section class="panel"><div class="panelhead"><h2>外陸資買賣超排名</h2><span class="tag">${esc(state.t86Date||'尚無資料')}</span></div><div class="filters"><input id="search" placeholder="搜尋股票" value="${esc(state.query)}"></div><div id="quotesTable">${table(rows.filter(x=>!state.query||(x.code+x.name).includes(state.query)),true)}</div><p class="sub">此欄為外陸資買賣超，不等同三大法人合計；資料於官方公布後更新，非盤中即時籌碼。</p></section>`;wireFilters()}
else if(state.view==='watch'){ $('pageTitle').textContent='我的自選';$('pageSub').textContent='自選清單儲存在目前瀏覽器';let rows=state.quotes.filter(x=>state.watch.includes(x.code));c.innerHTML=`<section class="panel"><div class="panelhead"><h2>自選股票</h2><span class="sub">${rows.length} 檔</span></div>${table(rows)}</section>`}
else if(state.view==='supply'){ $('pageTitle').textContent='供應鏈';$('pageSub').textContent='供應鏈關係需逐項以公司年報、法說會及公開資訊觀測站查證';c.innerHTML=`<section class="panel"><h2>供應鏈資料狀態</h2><p>目前尚未匯入經來源查證的公司供應鏈資料，因此不列出未經證實的上下游關係，避免將產業同類股誤標為直接供應商或客戶。</p><p class="sub">後續可逐家公司整理：供應商／客戶名稱、關係類型、產品或服務、公開來源、來源日期與可信度。</p></section>`}}
function wireFilters(){let s=$('search');if(s)s.oninput=e=>{state.query=e.target.value;let rows=state.view==='chips'?state.quotes.filter(x=>state.t86[x.code]).map(x=>({...x,net:state.t86[x.code].foreign_net_lots})).sort((a,b)=>b.net-a.net).filter(x=>(x.code+x.name).includes(state.query)):filtered();$('quotesTable').innerHTML=table(rows,state.view==='chips')};let m=$('market');if(m)m.onchange=e=>{state.market=e.target.value;render()};let so=$('sort');if(so)so.onchange=e=>{state.sort=e.target.value;render()}}
window.toggleWatch=code=>{state.watch=state.watch.includes(code)?state.watch.filter(x=>x!==code):[...state.watch,code];localStorage.setItem('tw-watch',JSON.stringify(state.watch));render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));state.view=b.dataset.view;state.query='';render()});$('refresh').onclick=load;load();
</script></body></html>
