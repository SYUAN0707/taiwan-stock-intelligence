<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>台股觀測站｜上市櫃行情與籌碼</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#17202c;--muted:#758092;--line:#e7eaf0;--blue:#315bd6;--blue2:#edf2ff;--red:#d84a4a;--green:#15966a;--shadow:0 5px 22px #17202c0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif}header{height:auto;min-height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:14px max(22px,calc((100% - 1440px)/2));position:sticky;top:0;z-index:4}.brand{font-size:19px;font-weight:800;white-space:nowrap}.brand i{font-style:normal;color:var(--blue)}nav{display:flex;gap:5px;flex-wrap:wrap}nav button,.tool{border:0;background:transparent;padding:9px 13px;border-radius:9px;color:var(--muted);font:inherit;cursor:pointer}nav button.active{background:var(--blue2);color:var(--blue);font-weight:700}#updated{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}main{max-width:1440px;margin:auto;padding:26px 24px 60px}.eyebrow{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.08em}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 20px}.heading h1{font-size:25px;margin:3px 0}.sub{color:var(--muted);font-size:13px}.notice{border:1px solid #f0dfb7;background:#fffaf0;color:#795b21;padding:11px 14px;border-radius:10px;margin-bottom:18px;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.market-dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:18px}.market-date-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 18px;box-shadow:var(--shadow)}.market-date-card strong{display:block;font-size:21px;margin:4px 0}.market-date-card small{color:var(--muted)}.metric,.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.metric{padding:16px 18px}.metric label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:23px;margin-top:5px}.metric small{color:var(--muted)}.panel{padding:18px;margin-bottom:17px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panelhead h2{font-size:16px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 11px;font:inherit}.filters input{min-width:220px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:11px 12px;border-bottom:1px solid #eff1f5}th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}th:first-child,td:first-child{text-align:left}.stock{font-weight:700}.code{color:var(--muted);font-size:12px;margin-left:7px}.up{color:var(--red)}.down{color:var(--green)}.muted{color:var(--muted)}.empty{text-align:center!important;padding:35px;color:var(--muted)}.tag{font-size:11px;background:#f1f3f7;color:#657084;padding:3px 8px;border-radius:99px}.star{border:0;background:none;color:#aab2bf;font-size:18px;cursor:pointer}.star.on{color:#e7a323}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stockcard{padding:17px;border:1px solid var(--line);border-radius:12px;background:#fff}.stockcard h3{margin:0 0 4px}.stockcard p{margin:5px 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;align-items:center}.primary{background:var(--blue);color:white;border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font:inherit}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}.detail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.detail div{background:#f8f9fc;padding:12px;border-radius:9px}.detail small{display:block;color:var(--muted)}.detail b{font-size:17px}.footer{color:var(--muted);font-size:12px;line-height:1.8;padding:10px 2px}.loading{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}header{gap:12px;flex-wrap:wrap}#updated{width:100%;margin:0}}@media(max-width:580px){main{padding:18px 12px 40px}.metrics,.market-dates{gap:8px}.market-date-card{padding:12px}.market-date-card strong{font-size:18px}.metric{padding:12px}.metric strong{font-size:19px}.grid{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.detail{grid-template-columns:repeat(2,1fr)}header{padding:12px}.brand{width:100%}}
</style></head><body>
<header><div class="brand">◈ <i>台股</i>觀測站</div><nav><button class="active" data-view="market">市場總覽</button><button data-view="stocks">個股查詢</button><button data-view="chips">法人排行</button><button data-view="watch">我的自選</button><button data-view="supply">權值股供應鏈</button></nav><div id="updated">資料載入中…</div></header>
<main><div class="heading"><div><div class="eyebrow">TAIWAN EQUITY INTELLIGENCE</div><h1 id="pageTitle">市場總覽</h1><div class="sub" id="pageSub">整合上市與上櫃官方每日收盤行情（非即時）</div></div><div class="actions"><button class="secondary" id="refresh">重新載入</button></div></div>
<div class="notice" id="notice">資料載入中。此網站不會以隨機數字填補缺漏資料。</div><section id="content"><div class="loading">正在讀取官方市場資料…</div></section>
<div class="footer">資料來源：臺灣證券交易所（TWSE）、證券櫃檯買賣中心（TPEx）每日行情；不使用即時行情或未確認授權的法人資料；各筆行情均標示官方資料日期。法人排行僅提供上櫃官方開放資料；上市個股法人資料暫不整合。資料可能因官方端點更新、維護或欄位異動而延遲或暫時無法取得。本網站資訊僅供研究參考，不構成投資建議。</div></main>
<script>
const API_BASE=location.hostname==='taiwan-stock-intelligence.onrender.com'?'https://taiwan-stock-intelligence-api.onrender.com':'';
const state={quotes:[],view:'market',query:'',market:'全部市場',sort:'volume',watch:JSON.parse(localStorage.getItem('tw-watch')||'[]'),selected:null};
const $=id=>document.getElementById(id),fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d}),dateLabel=v=>{if(!v)return '未取得';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?Number(m[2])+'月'+Number(m[3])+'日':String(v)},cls=v=>v>0?'up':v<0?'down':'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function fetchWithTimeout(url,options={},ms=25000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),ms);try{return await fetch(url,{...options,signal:controller.signal})}catch(e){if(e.name==='AbortError')throw Error('伺服器回應逾時（超過 '+Math.round(ms/1000)+' 秒）。請按「重新載入」再試；若持續發生，需檢查 Render 後端服務。');throw e}finally{clearTimeout(timer)}}
async function load(){
 $('notice').textContent='正在讀取證交所與櫃買中心官方每日收盤資料…';
 try{
  const response=await fetchWithTimeout(API_BASE+'/api/quotes',{cache:'no-store'},30000);
  if(!response.ok)throw Error('行情 API HTTP '+response.status);
  const q=await response.json();
  if(!Array.isArray(q.items)||!q.items.length)throw Error(q.error||q.errors?.join('；')||'官方每日行情目前沒有有效資料');
  state.quotes=q.items;state.quoteInfo=q;
  const dates=q.market_dates||{};
  $('updated').textContent='行情日期：上市 '+dateLabel(dates['上市'])+'／上櫃 '+dateLabel(dates['上櫃']);
  $('notice').textContent=(q.disclaimer||'官方每日收盤行情，非即時報價。')+' '+marketDateStatus()+(q.errors?.length?'；部分來源異常：'+q.errors.join('／'):'');
  render();
 }catch(e){
  $('updated').textContent='行情讀取失敗';$('notice').textContent='行情讀取失敗：'+e.message+'。請稍後重試；不顯示虛構行情。';
  $('content').innerHTML='<div class="panel empty">目前無法取得官方每日收盤行情。請確認後端 API 與 Render 部署狀態，再重新載入。</div>';
 }
}
function filtered(){let a=state.quotes.filter(x=>(state.market==='全部市場'||x.market===state.market)&&(!state.query||(x.code+x.name).toLowerCase().includes(state.query.toLowerCase())));a.sort((x,y)=>{let k=state.sort;if(k==='change')return (y.change??-Infinity)-(x.change??-Infinity);if(k==='volume')return (y.volume||0)-(x.volume||0);if(k==='name')return x.code.localeCompare(y.code);return (y.amount||0)-(x.amount||0)});return a}

function table(rows,showChips=false){if(!rows.length)return '<div class="empty">沒有符合條件的資料</div>';const displayRows=rows;return `<div class="tablewrap"><table><thead><tr><th>股票</th><th>市場</th><th>資料日期</th><th>每日收盤價（非即時）</th><th>漲跌</th><th>成交量（股）</th><th>成交金額（元）</th>${showChips?'<th>外資買賣超（張）</th>':''}<th>自選</th></tr></thead><tbody>${displayRows.map(x=>{return `<tr><td><span class="stock">${esc(x.name||'未提供名稱')}</span><span class="code">${esc(x.code)}</span></td><td><span class="tag">${esc(x.market)}</span></td><td>${dateLabel(x.trade_date)}</td><td>${fmt(x.price)} <span class="tag">${esc(x.price_label||'收盤價（非即時）')}</span></td><td class="${cls(x.change)}">${x.change==null?'—':(x.change>0?'+':'')+fmt(x.change)}</td><td>${fmt(x.volume,0)}</td><td>${fmt(x.amount,0)}</td><td><button class="star ${state.watch.includes(x.code)?'on':''}" onclick="toggleWatch('${esc(x.code)}')">${state.watch.includes(x.code)?'★':'☆'}</button></td></tr>`}).join('')}</tbody></table></div>`}

function marketDateStatus(){const d=state.quoteInfo?.market_dates||{},l=d['上市'],o=d['上櫃'];if(l&&o&&l===o)return '上市與上櫃官方資料日期一致：'+dateLabel(l)+'。';if(l&&o)return '注意：上市與上櫃官方資料日期不同（上市 '+dateLabel(l)+'、上櫃 '+dateLabel(o)+'），各市場分別顯示，不混用日期。';if(l||o)return '注意：目前僅取得'+(l?'上市':'上櫃')+'官方資料日期；另一市場日期尚未取得，請勿視為完整同步。';return '注意：尚未取得上市櫃官方資料日期。';}
function marketDateSummary(){const dates=state.quoteInfo?.market_dates||{};const count=m=>state.quotes.filter(x=>x.market===m).length;return '<section class="market-dates"><div class="market-date-card"><span class="sub">上市｜證交所官方資料日期</span><strong>'+dateLabel(dates['上市'])+'</strong><small>'+fmt(count('上市'),0)+' 檔有效行情</small></div><div class="market-date-card"><span class="sub">上櫃｜櫃買中心官方資料日期</span><strong>'+dateLabel(dates['上櫃'])+'</strong><small>'+fmt(count('上櫃'),0)+' 檔有效行情</small></div></section>';}
function metrics(){let all=state.quotes,up=all.filter(x=>(x.change||0)>0).length,down=all.filter(x=>(x.change||0)<0).length,amt=all.reduce((s,x)=>s+(x.amount||0),0);return `<div class="metrics"><div class="metric"><label>上市櫃資料筆數</label><strong>${fmt(all.length,0)}</strong><small>可能包含不同資料日期</small></div><div class="metric"><label>上漲檔數</label><strong class="up">${fmt(up,0)}</strong><small>依各市場各自資料日期</small></div><div class="metric"><label>下跌檔數</label><strong class="down">${fmt(down,0)}</strong><small>依官方漲跌價差欄位</small></div><div class="metric"><label>成交金額合計</label><strong>${amt?fmt(amt/1e8,1)+' 億':'—'}</strong><small>依目前取得資料加總，日期可能不同</small></div></div>`}
function render(){let c=$('content');if(state.view==='market'){ $('pageTitle').textContent='市場總覽';$('pageSub').textContent='上市櫃行情；輸入股票代號或名稱，查詢最近官方收盤價';c.innerHTML=marketDateSummary()+metrics()+`<section class="panel"><div class="panelhead"><h2>全市場最近收盤行情（非逐檔即時；各市場日期分開標示）</h2><div class="filters"><input id="search" placeholder="輸入股票代號或名稱" value="${esc(state.query)}"><select id="market"><option>全部市場</option><option ${state.market==='上市'?'selected':''}>上市</option><option ${state.market==='上櫃'?'selected':''}>上櫃</option></select><select id="sort"><option value="volume" ${state.sort==='volume'?'selected':''}>成交量由大到小</option><option value="amount" ${state.sort==='amount'?'selected':''}>成交金額排序</option><option value="change" ${state.sort==='change'?'selected':''}>漲跌排序</option><option value="volume" ${state.sort==='volume'?'selected':''}>成交量排序</option><option value="name" ${state.sort==='name'?'selected':''}>代號排序</option></select></div></div><div id="quotesTable">${table(filtered())}</div></section>`;wireFilters()}
else if(state.view==='stocks'){ $('pageTitle').textContent='個股查詢';$('pageSub').textContent='查詢官方每日收盤價，非盤中即時行情';c.innerHTML=`<section class="panel"><div class="panelhead"><h2>搜尋個股</h2></div><div class="filters"><input id="search" placeholder="例如 2330、台積電" value="${esc(state.query)}"></div><div id="quotesTable">${table(filtered())}</div></section>`;wireFilters()}
else if(state.view==='chips'){ $('pageTitle').textContent='法人籌碼';$('pageSub').textContent='目前暫停提供';c.innerHTML='<section class="panel"><h2>法人籌碼功能暫停</h2><p>目前先使用符合政府資料開放授權條款的官方每日收盤行情。法人資料來源與再利用授權確認後再恢復。</p></section>'}
else if(state.view==='watch'){ $('pageTitle').textContent='我的自選';$('pageSub').textContent='自選清單儲存在目前瀏覽器';let rows=state.quotes.filter(x=>state.watch.includes(x.code));c.innerHTML=`<section class="panel"><div class="panelhead"><h2>自選股票</h2><span class="sub">${rows.length} 檔</span></div>${table(rows)}</section>`}
else if(state.view==='supply'){ $('pageTitle').textContent='0050權值股供應鏈';$('pageSub').textContent='依元大投信0050官方持股權重排序前20大；供應鏈關係需有公開證據';c.innerHTML='<div class="loading">正在讀取0050官方持股與供應鏈資料…</div>';loadSupplyChain()}}
async function loadSupplyChain(){
 const c=$('content');
 try{
  const r=await fetchWithTimeout(API_BASE+'/api/supply-chain',{cache:'no-store'},20000);
  if(!r.ok)throw Error('供應鏈 API HTTP '+r.status);
  const apiData=await r.json();
  let h=apiData.holdings||{}, rels=Array.isArray(apiData.relations?.items)?apiData.relations.items:[];
  try{
   const [hr,rr]=await Promise.all([
    fetch('https://raw.githubusercontent.com/SYUAN0707/taiwan-stock-intelligence/main/data/0050_holdings.json',{cache:'no-store'}),
    fetch('https://raw.githubusercontent.com/SYUAN0707/taiwan-stock-intelligence/main/data/supply_chain_relations.json',{cache:'no-store'})
   ]);
   if(hr.ok){const latestHoldings=await hr.json();if(Array.isArray(latestHoldings.items)&&latestHoldings.items.length)h=latestHoldings;}
   if(rr.ok){const latestRelations=await rr.json();if(Array.isArray(latestRelations.items))rels=latestRelations.items;}
  }catch(ignore){}
  const rows=Array.isArray(h.items)?h.items:[];
  const byCode=new Map(state.quotes.map(x=>[x.code,x]));
  const stale=h.checked_at?('更新檢查時間：'+esc(h.checked_at)):'尚未完成第一次官方資料更新';
  const holdTable=rows.length?'<div class="tablewrap"><table><thead><tr><th>排名</th><th>股票</th><th>0050權重</th><th>官方收盤價</th><th>行情日期</th></tr></thead><tbody>'+rows.map(x=>{const q=byCode.get(String(x.code));return '<tr><td>'+esc(x.rank??'—')+'</td><td><b>'+esc(x.name)+'</b><span class="code">'+esc(x.code)+'</span></td><td>'+fmt(x.weight,3)+'%</td><td>'+(q?fmt(q.price):'—')+'</td><td>'+(q?dateLabel(q.trade_date):'尚無行情')+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">尚無可用的0050官方持股快照。請至 GitHub Actions 執行「Refresh 0050 top holdings」，待首次更新成功後這裡會自動顯示；不使用舊的估算權重填補。</div>';
  const names={"2891":"中信金","2881":"富邦金","2882":"國泰金","2887":"台新新光金","2885":"元大金","2884":"玉山金","2886":"兆豐金","2412":"中華電"};
  const buckets=[{key:'上游供應商',label:'上游供應商'},{key:'中游合作廠商',label:'中游合作廠商'},{key:'下游客戶',label:'下游客戶'}];
  const cards=rows.map(x=>{
   const code=String(x.code), own=rels.filter(z=>String(z.stock_code)===code);
   const sections=buckets.map(b=>{const found=own.filter(z=>z.direction===b.key|| (b.key==='中游合作廠商'&&/製造合作|中游/.test(z.direction||'')));
    const body=found.length?found.map(z=>'<div class="stockcard"><b>'+esc(z.counterparty||'未具名')+'</b><p>'+esc(z.product_or_service||'未說明')+'</p><p>查證狀態：'+esc(z.status||'待查證')+(z.source_url?'｜<a href="'+esc(z.source_url)+'" target="_blank" rel="noopener">公開來源</a>':'')+'</p></div>').join(''):'<p class="sub">尚待查證：目前沒有足夠公開證據可列出具名直接關係。</p>';
    return '<div style="margin:10px 0"><b>'+b.label+'</b>'+body+'</div>';
   }).join('');
   const special=names[code]?'此公司屬金融控股業，改以金融服務與投資生態系查證，不套用製造業供應鏈。':(code==='2412'?'此公司屬電信業，改以電信設備、網路建設及雲端服務生態系查證。':'');
   return '<details class="panel" style="margin:10px 0"><summary style="cursor:pointer;font-weight:700">'+esc(x.rank)+'. '+esc(x.name)+'（'+esc(code)+'）｜權重 '+fmt(x.weight,3)+'%｜'+(own.length?'已有 '+own.length+' 筆紀錄':'關係待補')+'</summary><div style="padding:12px 2px">'+(special?'<p class="sub">'+special+'</p>':'')+sections+'</div></details>';
  }).join('');
  const relationHtml=cards||'<div class="empty">尚未取得0050持股名單。</div>';
  c.innerHTML='<section class="panel"><div class="panelhead"><h2>0050實際持股權重前20大</h2><span class="tag">'+(h.source_type==='official'?'官方資料':'備援來源')+'</span></div><p class="sub">資料日期：'+dateLabel(h.source_date)+'｜'+stale+'</p><p class="sub">資料來源：'+esc(h.source_name||'尚未標示')+'｜<a href="'+esc(h.source_url||'https://www.yuantaetfs.com/product/detail/0050/ratio')+'" target="_blank" rel="noopener">查看來源</a></p><p class="sub">'+esc(h.ranking_basis||'依官方持股權重排序')+'</p>'+holdTable+(h.source_warnings?.length?'<p class="sub">來源備註：'+esc(h.source_warnings.join('；'))+'</p>':'')+'<p class="sub">'+esc(h.disclaimer||'')+'</p></section><section class="panel"><div class="panelhead"><h2>前20大公司供應鏈逐家查證</h2><span class="tag">點擊公司展開</span></div>'+relationHtml+'<p class="sub">已證實＝公開文件明確支持直接關係；待查證＝線索不足；未公開＝公司未揭露；產業關聯＝僅屬產業連結，不代表直接交易關係。</p></section>';
 }catch(e){c.innerHTML='<section class="panel"><h2>供應鏈資料讀取失敗</h2><p>'+esc(e.message)+'</p><p class="sub">請稍後重新載入；不以未查證資料替代。</p></section>'}
}
function wireFilters(){let s=$('search');if(s)s.oninput=e=>{state.query=e.target.value;let rows=filtered();$('quotesTable').innerHTML=table(rows,false);};let m=$('market');if(m)m.onchange=e=>{state.market=e.target.value;render()};let so=$('sort');if(so)so.onchange=e=>{state.sort=e.target.value;render()}}
window.toggleWatch=code=>{state.watch=state.watch.includes(code)?state.watch.filter(x=>x!==code):[...state.watch,code];localStorage.setItem('tw-watch',JSON.stringify(state.watch));render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));state.view=b.dataset.view;state.query='';render()});$('refresh').onclick=load;load();
