name: Refresh 0050 top holdings

on:
  schedule:
    - cron: "0 7 * * *" # 15:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-0050-holdings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Fetch official 0050 holdings and update top 20
        run: python scripts/update_0050_holdings.py
      - name: Commit refreshed holdings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/0050_holdings.json
          if git diff --cached --quiet; then
            echo "No holdings changes."
          else
            git commit -m "Refresh official 0050 top 20 holdings"
            git push origin HEAD:main
          fi
